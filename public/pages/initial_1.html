<!-- 
  Page 1: Initial Character Setup
  This content is loaded into the <main> element of index.html
-->
<div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-stone-800 mb-6">Step 1: Initial Details</h2>
    <div class="bg-white p-6 rounded-lg shadow-md space-y-6">
        
        <!-- Player & Character Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="player-name" class="block text-sm font-medium text-stone-700 mb-1">Player Name</label>
                <input type="text" id="player-name" class="w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label for="char-name" class="block text-sm font-medium text-stone-700 mb-1">Character Name</label>
                <input type="text" id="char-name" class="w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
        </div>

        <!-- Level -->
        <div>
            <label for="level-select" class="block text-sm font-medium text-stone-700 mb-1">Level</label>
            <select id="level-select" class="w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
            </select>
        </div>

        <!-- Race, Class, Sub-Race Dropdowns -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="race-select" class="block text-sm font-medium text-stone-700 mb-1">Race</label>
                <select id="race-select" class="w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
                    <option>Loading...</option>
                </select>
            </div>
             <div>
                <label for="class-select" class="block text-sm font-medium text-stone-700 mb-1">Class</label>
                <select id="class-select" class="w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
                    <option>Loading...</option>
                </select>
            </div>
        </div>

        <div>
            <label for="background-select" class="block text-sm font-medium text-stone-700 mb-1">Background</label>
            <select id="background-select" class="w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
                <option>Loading...</option>
            </select>
        </div>
        
        <div>
            <label for="subrace-select" class="block text-sm font-medium text-stone-700 mb-1">Sub-Race (if applicable)</label>
            <select id="subrace-select" class="w-full md:w-1/2 px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
                <option>Loading...</option>
            </select>
        </div>

    </div>
</div>
